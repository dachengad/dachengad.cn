<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网站建设中 | dachengad.cn</title>
  <meta name="description" content="dachengad.cn 正在建设中，敬请期待。" />
  <style>
    :root {
      --bg: #0a0a0c;
      --fg: #f4f4f5;
      --muted: #9ca3af;
      --accent: #22d3ee;
      --accent-2: #a78bfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 背景光晕 */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      pointer-events: none;
    }

    body::before {
      width: 60vw;
      height: 60vw;
      background: var(--accent);
      top: -25vw;
      left: -20vw;
      animation: drift 18s ease-in-out infinite alternate;
    }

    body::after {
      width: 55vw;
      height: 55vw;
      background: var(--accent-2);
      bottom: -25vw;
      right: -15vw;
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(6%, 8%, 0) scale(1.15);
      }
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px 24px;
      max-width: 640px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--muted);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
      backdrop-filter: blur(8px);
    }

    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.8);
      }
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(100deg, #fff 20%, var(--accent) 55%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 18px;
    }

    p {
      color: var(--muted);
      font-size: clamp(0.95rem, 2.2vw, 1.08rem);
      line-height: 1.75;
    }

    .progress {
      width: min(320px, 78%);
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      margin: 36px auto 0;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      animation: load 2.4s ease-in-out infinite;
    }

    @keyframes load {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }

    footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.05em;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">
      <span class="dot"></span>
      UNDER CONSTRUCTION
    </div>
    <h1>网站正在建设中</h1>
    <p>
      我们正在打磨更好的内容与体验，<br />
      敬请期待。
    </p>
    <div class="progress"><span></span></div>
  </main>
  <footer>© 2026 dachengad.cn</footer>
</body>
</html>
